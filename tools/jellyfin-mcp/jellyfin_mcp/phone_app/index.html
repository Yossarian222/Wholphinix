<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#10131c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Telka">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Telka</title>
<script>
  // /<secret>/app and /<secret>/app/ serve the same page: resolve our files against /<secret>/app/
  (function () {
    var p = location.pathname.replace(/\/+$/, "");
    if (p !== location.pathname) history.replaceState(null, "", p + location.search);
    window.APP_BASE = p + "/";
    [["manifest", "manifest.webmanifest"], ["icon", "icon-192.png"], ["apple-touch-icon", "icon-192.png"]]
      .forEach(function (l) {
        var e = document.createElement("link");
        e.rel = l[0];
        e.href = window.APP_BASE + l[1];
        document.head.appendChild(e);
      });
  })();
</script>
<style>
  :root {
    --bg: #10131c;
    --surface: #181c28;
    --surface-2: #222838;
    --line: #2c3346;
    --text: #e8ebf3;
    --muted: #9aa3b8;
    --accent: #7c9cff;
    --accent-ink: #0d1120;
    --warm: #ffc45c;
    --me: #2f3f78;
    --danger: #ff7a7a;
    --ok: #5fd39a;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f5f9;
      --surface: #ffffff;
      --surface-2: #eceef5;
      --line: #dde1ea;
      --text: #161a24;
      --muted: #5d6578;
      --accent: #3d5ce0;
      --accent-ink: #ffffff;
      --warm: #c07a00;
      --me: #dfe6ff;
      --danger: #c43c3c;
      --ok: #1f8f58;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { display: block; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--danger); }
  header .spacer { flex: 1; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 0;
    background: transparent; display: grid; place-items: center;
  }
  .icon-btn:active { background: var(--surface-2); }
  .icon-btn.active { color: var(--accent); }

  .now {
    margin: 0 16px; padding: 12px 14px; border-radius: 18px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .now .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .sub { color: var(--muted); font-size: 14px; margin-top: 2px; min-height: 1.4em; }
  .progress { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  .remote { display: flex; justify-content: space-between; margin-top: 10px; gap: 4px; }
  .remote button {
    flex: 1; height: 46px; border-radius: 14px; border: 0;
    background: var(--surface-2); display: grid; place-items: center;
  }
  .remote button.main { background: var(--accent); color: var(--accent-ink); }
  .remote button:active { transform: scale(.94); }
  .now.idle .remote, .now.idle .progress { display: none; }

  main { flex: 1; overflow-y: auto; padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 8px; }
  .msg {
    max-width: 85%; padding: 9px 13px; border-radius: 18px; white-space: pre-wrap;
    overflow-wrap: anywhere; animation: pop .18s ease-out;
  }
  .msg.me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 6px; }
  .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .msg.err { color: var(--danger); }
  .msg.note { align-self: center; background: none; color: var(--muted); font-size: 13px; padding: 2px; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .typing span {
    display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%;
    background: var(--muted); animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .empty { margin: auto 0; text-align: center; color: var(--muted); padding: 20px 8px; }
  .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 6px 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex: none; border: 1px solid var(--line); background: var(--surface);
    border-radius: 999px; padding: 7px 13px; font-size: 14px;
  }
  .chips button:active { background: var(--surface-2); }

  form {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 10px);
  }
  textarea {
    flex: 1; resize: none; max-height: 120px; min-height: 46px;
    border-radius: 23px; border: 1px solid var(--line); background: var(--surface);
    color: var(--text); font: inherit; padding: 11px 16px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .round {
    width: 46px; height: 46px; border-radius: 50%; border: 0; flex: none;
    display: grid; place-items: center; background: var(--surface-2);
  }
  .round.send { background: var(--accent); color: var(--accent-ink); }
  .round:disabled { opacity: .45; }
  .round.listening { background: var(--danger); color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px transparent; } 0% { box-shadow: 0 0 0 0 rgba(255,122,122,.5); } }

  .menu {
    position: absolute; right: 12px; top: calc(env(safe-area-inset-top) + 56px); z-index: 5;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 6px; min-width: 220px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: flex; width: 100%; text-align: left; border: 0; background: none;
    padding: 11px 12px; border-radius: 10px; justify-content: space-between;
  }
  .menu button:active { background: var(--surface-2); }
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: var(--surface-2); color: var(--text); padding: 8px 14px; border-radius: 12px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Telka</h1>
  <span class="dot" id="dot" title="Stav TV"></span>
  <span class="spacer"></span>
  <button class="icon-btn" id="speakBtn" aria-label="Čítať odpovede nahlas" title="Čítať odpovede nahlas">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
  </button>
  <button class="icon-btn" id="menuBtn" aria-label="Menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
  </button>
</header>
<div class="menu" id="menu" hidden>
  <button id="newChat">Nový rozhovor <span>🧹</span></button>
  <button id="refresh">Obnoviť stav TV <span>🔄</span></button>
</div>

<section class="now idle" id="now" aria-live="polite">
  <div class="title" id="nowTitle">Zisťujem, čo beží…</div>
  <div class="sub" id="nowSub"></div>
  <div class="progress"><div id="nowBar"></div></div>
  <div class="remote">
    <button data-act="previous" aria-label="Predchádzajúca epizóda"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button data-act="back" data-sec="30" aria-label="Späť o 30 sekúnd"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><text x="12" y="16" font-size="8" text-anchor="middle" fill="currentColor" stroke="none" font-family="system-ui" font-weight="700">30</text></svg></button>
    <button data-act="toggle" class="main" aria-label="Pauza / pokračovať"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l9 8-9 8zM15 5h2.5v14H15zM19.5 5H22v14h-2.5z"/></svg></button>
    <button data-act="forward" data-sec="30" aria-label="Dopredu o 30 sekúnd"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><text x="12" y="16" font-size="8" text-anchor="middle" fill="currentColor" stroke="none" font-family="system-ui" font-weight="700">30</text></svg></button>
    <button data-act="next" aria-label="Ďalšia epizóda"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button data-act="stop" aria-label="Zastaviť"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
  </div>
</section>

<main id="log">
  <div class="empty" id="empty">
    <b>Ahoj! 👋</b>
    Napíš alebo povedz, čo pustiť na telke.<br>Napr. „pusti Pelíšky s titulkami“.
  </div>
</main>

<div class="chips" id="chips">
  <button>Čo dnes dávajú v TV?</button>
  <button>Tip na večer</button>
  <button>Pokračuj v rozpozeranom seriáli</button>
  <button>Vypni titulky</button>
  <button>Daj český dabing</button>
  <button>Čo práve beží?</button>
</div>

<form id="composer" autocomplete="off">
  <textarea id="input" rows="1" placeholder="Napíš správu…" enterkeyhint="send" aria-label="Správa"></textarea>
  <button type="button" class="round" id="micBtn" aria-label="Diktovať" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
  </button>
  <button type="submit" class="round send" id="sendBtn" aria-label="Odoslať">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg>
  </button>
</form>
<div class="toast" id="toast"></div>
<script>
  var s = document.createElement("script");
  s.src = window.APP_BASE + "app.js";
  document.body.appendChild(s);
</script>
</body>
</html>
