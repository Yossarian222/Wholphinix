# Portainer stack "jellyfin-mcp" (Repository: Yossarian222/Wholphinix, compose path tools/jellyfin-mcp/docker-compose.yml)
# Stack environment variables to set in Portainer:
#   TS_AUTHKEY, JELLYFIN_API_KEY, JELLYFIN_USER, MCP_SECRET
# Optional: SEERR_URL, SEERR_API_KEY (request_on_seerr), TARGET_DEVICE
# Optional WhatsApp bot (README "WhatsApp"): WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID,
#   WHATSAPP_APP_SECRET, WHATSAPP_VERIFY_TOKEN, WHATSAPP_ALLOWED_NUMBERS, ANTHROPIC_API_KEY,
#   CLAUDE_MODEL, CLAUDE_EFFORT, GRAPH_VERSION
services:
  ts:
    image: tailscale/tailscale:stable
    container_name: jellyfin-mcp-ts
    hostname: jellyfin-mcp
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - /volume1/docker/jellyfin-mcp/ts-state:/var/lib/tailscale
      - /volume1/docker/jellyfin-mcp/serve.json:/config/serve.json:ro
    restart: unless-stopped

  mcp:
    build: .
    image: jellyfin-mcp:local
    container_name: jellyfin-mcp
    # Shares the tailscale container's network: Funnel proxies to 127.0.0.1:8765
    network_mode: service:ts
    depends_on:
      - ts
    environment:
      - JELLYFIN_URL=http://192.168.1.201:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - JELLYFIN_USER=${JELLYFIN_USER}
      - MCP_SECRET=${MCP_SECRET}
      - TARGET_CLIENT=Wholphin
      - TARGET_DEVICE=${TARGET_DEVICE:-}
      # Optional, for request_on_seerr; leave empty to disable
      - SEERR_URL=${SEERR_URL:-}
      - SEERR_API_KEY=${SEERR_API_KEY:-}
      # Optional WhatsApp bot at /<MCP_SECRET>/whatsapp; disabled (404) unless the first six are set
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - WHATSAPP_ALLOWED_NUMBERS=${WHATSAPP_ALLOWED_NUMBERS:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - CLAUDE_EFFORT=${CLAUDE_EFFORT:-}
      - GRAPH_VERSION=${GRAPH_VERSION:-}
    restart: unless-stopped
