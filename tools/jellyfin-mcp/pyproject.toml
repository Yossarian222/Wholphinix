[project]
name = "jellyfin-mcp"
version = "0.1.0"
description = "MCP server letting Claude control Jellyfin playback on the Wholphinix TV app"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jellyfin-mcp = "jellyfin_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jellyfin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
