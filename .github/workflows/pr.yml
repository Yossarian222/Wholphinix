name: PR

on:
  pull_request:
  push:
    branches:
      - 'ci/**'

defaults:
  run:
    shell: bash

env:
  BUILD_DIRS_ARTIFACT: build-dirs
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0 # Need the tags to build
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.14'
    - name: Run pre-commit
      uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  build:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build app
        id: buildapp
        env:
          # Same private key for every build, so a new debug APK installs as an update (empty = default debug key)
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set +e
          ./gradlew clean assembleDefaultDebug testDefaultDebugUnitTest --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface compiler/test errors as an annotation (readable without access to the logs)
            msg=$(grep -E '^e: |FAILED|What went wrong|Exception|expected:' -A2 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
            exit "$status"
          fi
          set -e
          apks=$(find app/build/outputs \( -name '*.apk' -or -name '*.aab' \) -print0 | tr '\0' ',' | sed 's/,$//')
          echo "apks=$apks" >> "$GITHUB_OUTPUT"
      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wholphinix-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
          retention-days: 7
      # Release APK for the TV: not debuggable, signed with the private key from the repository secrets
      # (SIGNING_KEY = base64 keystore, KEY_ALIAS, KEY_PASSWORD, KEY_STORE_PASSWORD). Without the secrets it is
      # signed with a throwaway key only to check that the release (R8) build works, and not uploaded.
      - name: Build release APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "No signing secrets, using a throwaway key"
            pass=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -alias throwaway -keyalg RSA -keysize 2048 \
              -validity 1 -storepass "$pass" -keypass "$pass" -dname "CN=throwaway" -noprompt
            export SIGNING_KEY=$(base64 -w0 "$RUNNER_TEMP/throwaway.jks") KEY_ALIAS=throwaway \
              KEY_PASSWORD="$pass" KEY_STORE_PASSWORD="$pass"
          else
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          fi
          ./gradlew assembleDefaultRelease --no-daemon
      - name: Upload release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wholphinix-release-apk
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 14
