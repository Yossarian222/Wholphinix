name: Create release

on:
  push:
    tags:
      - v*
  # Release from the Actions tab (or the GitHub API): creates the tag vX.Y.Z on main and publishes it
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 1.0.1"
        required: true

defaults:
  run:
    shell: bash

env:
  APK_SHORT_NAME: Wholphin.apk
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            # A tag left behind by a failed run (no release yet) is moved to the current commit
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "::error::Release $TAG_NAME already exists, pick a new version"
              exit 1
            fi
            echo "Tag $TAG_NAME has no release yet, moving it to $(git rev-parse --short HEAD)"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$TAG_NAME" -m "Wholphinix $VERSION"
          git push -f origin "refs/tags/$TAG_NAME"
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build app
        id: buildapp
        env:
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          KEY_STORE_PASSWORD: "${{ secrets.KEY_STORE_PASSWORD }}"
          SIGNING_KEY: "${{ secrets.SIGNING_KEY }}"
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::Release needs the signing secrets (SIGNING_KEY, KEY_ALIAS, KEY_PASSWORD, KEY_STORE_PASSWORD)"
            exit 1
          fi
          # Unit tests in the same run, so a release needs no separate CI build beforehand
          ./gradlew clean testDefaultDebugUnitTest assembleDefaultRelease
      - name: Verify signatures
        run: |
          echo "Verify APK signatures"
          find app/build/outputs \( -name '*.apk' -or -name '*.aab' \)
          find app/build/outputs \( -name '*.apk' \) -print0 | xargs -0 -n1 ${{env.ANDROID_SDK_ROOT}}/build-tools/${{ env.BUILD_TOOLS_VERSION }}/apksigner verify --verbose --print-certs
      - name: Copy APK to shorter names
        id: apks
        run: |
          find app/build/outputs/apk -name '*.apk' -print0 |
            while IFS= read -r -d '' line; do
              # Wholphin-default-release-1.0.0-0-g5c12e03-1-arm64-v8a.apk => Wholphin-release-arm64-v8a.apk
              # (the names the in-app updater looks for, see getDownloadUrl in UpdateChecker.kt)
              short_name="$(echo $line | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-g[a-fA-F0-9]+-[0-9]+//' | sed -E 's/-default//')"
              echo "$line => $short_name"
              cp "$line" "$short_name"
            done
      - name: Checksums
        run: |
          echo "SHA256 checksums:"
          find app/build/outputs \( -name '*.apk' -or -name '*.aab' \) -print0 | xargs -0 sha256sum
      - name: Upload mapping files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mapping
          path: |
            app/build/outputs/**/mapping.txt
          compression-level: 6
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar

          # Not a draft: the in-app updater reads /releases/latest, which skips drafts
          gh release create "${{ env.TAG_NAME }}" \
            --latest --title "${{ env.TAG_NAME }}" --verify-tag --generate-notes \
            app/build/outputs/apk/**/Wholphin-release*.apk
